name: macOS

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Apple Silicon (ARM64)"
            os: macos-15
            preset: macos-arm64
            artifact_suffix: apple-silicon
          - name: "Intel (x86_64)"
            os: macos-13
            preset: macos-x86_64
            artifact_suffix: intel

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Download and extract the minimal cd.iso used by the test suite.
      # The CMake preset has EXTRACT_DATA=OFF, so a missing file no longer
      # blocks the build; we still fetch it so that ctest can exercise the
      # data-loading code paths.
      - name: Download minimal cd image
        run: wget http://s2.jonnyh.net/pub/cd_minimal.iso.xz -O $GITHUB_WORKSPACE/data/cd.iso.xz

      - name: Extract minimal cd image
        run: xz -d $GITHUB_WORKSPACE/data/cd.iso.xz

      - name: Install dependencies
        run: brew install cmake boost sdl2 libvorbis ninja

      # Configure + build using the standardised CMake preset.
      # This is the same flow documented in tools/macos-setup.sh.
      - name: Configure (preset ${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} -S $GITHUB_WORKSPACE

      - name: Build (preset ${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (preset ${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # Smoke test: verify the app bundle structure and that the binary
      # starts cleanly (--help exits before SDL/display initialisation).
      # A non-1 non-0 exit code indicates a crash (SIGSEGV = 139, etc.).
      - name: Smoke test — app bundle
        run: |
          EXEC="${GITHUB_WORKSPACE}/build/${{ matrix.preset }}/bin/OpenApoc.app/Contents/MacOS/OpenApoc"
          echo "Checking bundle structure …"
          test -d "${GITHUB_WORKSPACE}/build/${{ matrix.preset }}/bin/OpenApoc.app"
          test -x "$EXEC"
          echo "Checking library links …"
          otool -L "$EXEC"
          echo "Running startup probe (--help) …"
          set +e
          "$EXEC" --help > /tmp/openapoc-help.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat /tmp/openapoc-help.txt
          # EXIT_FAILURE (1) is expected when --help is passed; 0 is also fine.
          # Anything else indicates a crash or missing library.
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then
            echo "Startup probe failed with exit code $EXIT_CODE — possible crash or missing library."
            exit 1
          fi
          echo "Startup probe OK (exit code $EXIT_CODE)"

      # Upload the app bundle so the artifact can be downloaded and run
      # directly — matching the "download artifact and run" user path.
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenApoc-macOS-${{ matrix.artifact_suffix }}
          path: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/OpenApoc.app
          if-no-files-found: error
