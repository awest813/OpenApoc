name: Release (macOS)

# Triggered when a version tag is pushed (e.g. v0.1.0, v1.2.3-alpha).
# Builds native arm64 and x86_64 app bundles, packages them as .zip archives,
# and attaches them to a GitHub Release so users can download and run without
# compiling.
#
# Which artifact should I download?
#   OpenApoc-macOS-apple-silicon.zip  →  M1 / M2 / M3 / M4 Macs (arm64)
#   OpenApoc-macOS-intel.zip          →  Intel Macs (x86_64)
#
# After downloading, unzip, right-click → Open (to bypass Gatekeeper on first
# launch), then copy data/cd.iso into the same folder as OpenApoc.app.

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------------------------------
  # Build one app bundle per architecture
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 != '' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD != '' && secrets.MACOS_DEVELOPER_ID != '' }}
      MACOS_NOTARIZATION_ENABLED: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Apple Silicon (arm64)"
            os: macos-15
            preset: macos-arm64
            artifact_suffix: apple-silicon
          - name: "Intel (x86_64)"
            os: macos-15-intel
            preset: macos-x86_64
            artifact_suffix: intel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake boost sdl2 libvorbis ninja

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} -S ${{ github.workspace }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Smoke test — startup probe
        run: |
          EXEC="${{ github.workspace }}/build/${{ matrix.preset }}/bin/OpenApoc.app/Contents/MacOS/OpenApoc"
          test -x "$EXEC"
          set +e
          "$EXEC" --help > /tmp/probe.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/probe.txt
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 1 ]; then
            echo "Startup probe failed (exit $CODE)"
            exit 1
          fi

      # Optional signing stage. Configure these repository secrets to enable it:
      #   MACOS_SIGNING_CERTIFICATE_P12      base64-encoded Developer ID .p12
      #   MACOS_SIGNING_CERTIFICATE_PASSWORD password for the .p12
      #   MACOS_DEVELOPER_ID                 Developer ID Application identity
      - name: Import signing certificate
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${{ runner.temp }}/openapoc-signing.keychain-db"
          CERT_PATH="${{ runner.temp }}/openapoc-signing.p12"
          echo "$MACOS_SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"

      - name: Sign app bundle
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: |
          APP="${{ github.workspace }}/build/${{ matrix.preset }}/bin/OpenApoc.app"
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_DEVELOPER_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Package the app bundle as a zip.
      # `ditto` preserves macOS resource forks and extended attributes.
      - name: Package app bundle
        run: |
          cd "${{ github.workspace }}/build/${{ matrix.preset }}/bin"
          ditto -c -k --keepParent OpenApoc.app \
            "${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip"

      # Optional notarization stage. In addition to signing secrets, configure:
      #   MACOS_NOTARY_APPLE_ID              Apple ID email
      #   MACOS_NOTARY_TEAM_ID               Apple Developer Team ID
      #   MACOS_NOTARY_PASSWORD              app-specific password
      - name: Notarize app bundle
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' && env.MACOS_NOTARIZATION_ENABLED == 'true' }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ZIP="${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip"
          APP="${{ github.workspace }}/build/${{ matrix.preset }}/bin/OpenApoc.app"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm "$ZIP"
          cd "${{ github.workspace }}/build/${{ matrix.preset }}/bin"
          ditto -c -k --keepParent OpenApoc.app "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenApoc-macOS-${{ matrix.artifact_suffix }}
          path: ${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

      # Generate a SHA-256 checksum so users can verify integrity after download.
      - name: Generate checksum
        run: |
          shasum -a 256 \
            "${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip" \
            > "${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip.sha256"
          cat "${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip.sha256"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: OpenApoc-macOS-${{ matrix.artifact_suffix }}-sha256
          path: ${{ github.workspace }}/OpenApoc-macOS-${{ matrix.artifact_suffix }}.zip.sha256
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Create the GitHub Release and attach both zip archives
  # -----------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # Combine per-arch checksums into one file for easy verification.
      - name: Combine checksums
        run: |
          cat release-assets/*.sha256 > release-assets/checksums-sha256.txt
          echo "=== SHA-256 checksums ==="
          cat release-assets/checksums-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "OpenApoc $TAG" \
            --notes "## Which download do I need?

          | I have… | Download |
          |---|---|
          | Apple Silicon Mac (M1 / M2 / M3 / M4) | \`OpenApoc-macOS-apple-silicon.zip\` |
          | Intel Mac | \`OpenApoc-macOS-intel.zip\` |

          > **Not sure?** Click the Apple menu → **About This Mac**. If it says \"Apple M…\" you have Apple Silicon. If it says \"Intel Core\" you have an Intel Mac.

          ## Signing status

          Release artifacts are signed and notarized when the repository's Apple
          Developer ID secrets are configured. If macOS reports an unidentified
          developer warning, right-click \`OpenApoc.app\` → **Open** once or see
          SUPPORT.md for the quarantine workaround.

          ## First-time setup (3 steps)

          1. **Download** the zip for your Mac from the list above.
          2. **Unzip** and move \`OpenApoc.app\` anywhere you like.
          3. **Right-click → Open** the first time — Gatekeeper will warn about an unsigned app; click *Open* to proceed.

          Then place your game data file next to \`OpenApoc.app\`:

          - **Steam:** copy \`cd.iso\` from the X-COM: Apocalypse install folder.
          - **GOG:** copy \`xcom.cue\` and \`xcom.bin\`, then rename \`xcom.cue\` to \`cd.iso\`.

          Double-click \`OpenApoc.app\` to play.

          > **Game data required.** OpenApoc does not include game assets. You must own a copy of X-COM: Apocalypse (Steam or GOG).

          ## Verify download integrity

          \`\`\`sh
          # Download checksums-sha256.txt from this release, then:
          shasum -a 256 -c checksums-sha256.txt
          \`\`\`

          ## Troubleshooting

          See [SUPPORT.md](https://github.com/${{ github.repository }}/blob/master/SUPPORT.md) for the full platform support matrix, Gatekeeper workarounds, and known limitations." \
            release-assets/*.zip release-assets/checksums-sha256.txt
